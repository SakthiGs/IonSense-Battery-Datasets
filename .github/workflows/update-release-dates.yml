name: Update release dates

on:
  schedule:
    - cron: "32 3 * * 0"   # 03:32 UTC every Sunday
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/datasets.json
      - scripts/update_release_dates.py
      - scripts/release_date_overrides.json
      - .github/workflows/update-release-dates.yml

permissions:
  contents: write

# Both metadata workflows publish to main; serialize their writes.
concurrency:
  group: ionsense-generated-metadata
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Look up release dates
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update_release_dates.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Publish metadata (safe retry after concurrent commits)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/publish_generated_metadata.py \
            docs/release_dates.json \
            "Update dataset release dates" \
            scripts/update_release_dates.py
