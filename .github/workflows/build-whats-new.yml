name: Build what's new

on:
  schedule:
    - cron: "52 3 * * 0"   # weekly, so 'New' badges expire on time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/datasets.json
      - docs/research_uses.json
      - scripts/whats_new_notes.json
      - scripts/build_whats_new.py
      - .github/workflows/build-whats-new.yml

permissions:
  contents: write

concurrency:
  group: build-whats-new
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needs full history to date each addition
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs/whats_new.json from git history
        run: python scripts/build_whats_new.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/whats_new.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Update what's new"
          git pull --rebase origin main
          git push
