name: Build what's new

on:
  schedule:
    - cron: "52 3 * * 0"   # weekly, so 'New' badges expire on time
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - docs/datasets.json
      - docs/research_uses.json
      - scripts/whats_new_notes.json
      - scripts/build_whats_new.py
      - .github/workflows/build-whats-new.yml

permissions:
  contents: write

# Both metadata workflows publish to main; serialize their writes.
concurrency:
  group: ionsense-generated-metadata
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # needs full history to date each addition
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build docs/whats_new.json from git history
        run: python scripts/build_whats_new.py
      - name: Publish metadata (safe retry after concurrent commits)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python scripts/publish_generated_metadata.py \
            docs/whats_new.json \
            "Update what's new" \
            scripts/build_whats_new.py
